<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Your Dream · 剧幕之外</title>
  <link rel="stylesheet" href="/style.css?v=beyond-screen-1">
  <script src="/app.js?v=milestone-outline-1" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div><p class="eyebrow">FROM YOUR DREAM</p><h1 id="story-title">剧幕之外</h1></div>
      <span class="tag">单人故事 · 演示版</span>
    </header>

    <section class="account-panel" aria-label="选择账号">
      <div class="section-label">你的故事身份</div>
      <div class="account-controls">
        <label for="account-id" class="sr-only">账号字符串</label>
        <input id="account-id" maxlength="13" placeholder="输入已有的账号 ID" autocomplete="off">
        <button id="use-account" class="primary">进入故事</button>
        <button id="create-account">生成新身份</button>
        <label for="accounts" class="sr-only">已有账号</label>
        <select id="accounts"><option value="">选择已有身份</option></select>
        <button id="refresh-accounts" aria-label="刷新账号列表">刷新</button>
      </div>
      <p class="hint">使用生成的字符串区分身份。进度暂存在本次服务运行期间，重启后重新开始。</p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">先生成一个身份，或选择已有身份进入故事。</p>

    <section id="game" hidden>
      <div class="story-toolbar">
        <span id="progress" class="section-label"></span>
        <div><button id="history-button">回看对话</button><button id="reset-button">重新开始</button></div>
      </div>

      <section class="stage" aria-label="故事舞台">
        <div id="scene-label" class="scene-label"></div>
        <p id="narration" class="narration"></p>
        <p id="scene-environment" class="scene-environment" hidden></p>
        <p id="presence-label" class="section-label"></p>
        <div id="characters" class="characters" aria-label="在场角色"></div>
        <p id="player-input" class="player-input" hidden></p>
        <div id="responses" class="responses" aria-label="在场角色的回应"></div>
        <article id="story-beat" class="story-beat" aria-label="交谈后的剧情" hidden>
          <p class="eyebrow">剧情演绎</p>
          <p id="story-narration"></p>
        </article>
      </section>

      <section id="ending-panel" class="ending-panel" hidden>
        <p class="eyebrow">这一夜的尾声</p><h2>属于你的结局</h2><p id="ending-text"></p>
      </section>

      <section id="decision-panel" class="decision-panel" aria-labelledby="decision-question">
        <p class="eyebrow">轮到你决定</p>
        <h2 id="decision-question"></h2>
        <div id="decision-choices" class="decision-choices" aria-label="关键选择"></div>
        <p id="decision-status" class="status"></p>
        <p class="hint">每个选择都有取舍。作出决定后，人物对白、行动和过渡会连续演绎，直到下一个关键时刻。</p>
        <details id="custom-decision" class="custom-decision">
          <summary>我有另一个决定</summary>
          <form id="chat-form" class="chat-form">
            <label for="message">在这个分歧上，你准备怎样做？</label>
            <textarea id="message" rows="3" maxlength="1000" placeholder="写出你的决定，也可以说明你愿意承担的代价。" required></textarea>
            <div class="form-footer">
              <span>重要立场由你决定，日常应答由 AI 演绎。</span>
              <button id="send-button" class="primary" type="submit">作出决定</button>
            </div>
          </form>
        </details>
      </section>

      <section id="history-panel" class="history-panel" hidden>
        <div class="history-heading"><h2>已经发生的故事</h2><button id="close-history">收起</button></div>
        <div id="history-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
