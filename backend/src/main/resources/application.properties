# Redis and server settings can remain in the existing local application.yml.
# API key: DEEPSEEK_API_KEY environment variable or dream.ai.api-key in local YAML.
dream.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
dream.ai.model=${DEEPSEEK_MODEL:deepseek-chat}

# Revalidate local UI assets after a service update.
spring.web.resources.cache.cachecontrol.no-cache=true
